dp_0_decisions: 变更名：vue-customer-service-frontend。意图：在现有已验收的 Dify 跨境电商客服机器人基础上，建设独立 Vue 3 前端与独立 Fastify 后端服务。范围：前端提供客服工作台与消费者聊天页两种模式；后端代理 Dify API 并支持流式会话；保存会话、消息、语言、摘要和人工转接状态到 MySQL；通过飞书 Webhook 推送转接通知，并通过飞书自建应用机器人支持双向协作；主题通过配置文件和 CSS 变量定制；同时规划 Docker Compose 与生产云部署。约束：Dify API Key 仅保存在后端；复用现有英语、越南语、泰语、商品/物流/售后问答及人工转接规则；不执行真实退款赔付；不接入外部电商平台；客服数据分析和可视化主题编辑器后置。沟通方式：先生成完整规划包，用户统一审核。artifact_language=中文；workflow_path=full；recommendation=full，用户已确认。
